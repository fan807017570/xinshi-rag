# xinshi-rag 运行配置。
#
# 修改后需要重启应用进程或 Docker 容器，不需要重新构建镜像。
# 相对路径统一以项目根目录为基准。

[runtime]
# 原生运行默认使用 native；Docker Compose 会自动切换为 docker。
profile = native

[milvus]
enabled = true
host = 127.0.0.1
port = 19531
collection = Xinshi_school

[milvus:docker]
host = milvus-standalone
port = 19530

[models]
embedding_model = ./rag/models/bge-base-zh-v1.5
embedding_model_cache_dir = ./rag/models
rerank_model = ./rag/models/bge-reranker-large
rerank_model_cache_dir = ./rag/models

[models:docker]
embedding_model_cache_dir = /app/hf_cache
rerank_model_cache_dir = /app/hf_cache

[reranker]
backend = torch
batch_size = 64
max_length = 256
# 必须覆盖教师/学生角色放大后的全部召回候选：20 * 3 = 60。
candidate_limit = 60
query_char_limit = 256
doc_char_limit = 800
score_cache_size = 4096

[retrieval]
top_k_retrieve = 20
top_k_rerank = 5
role_filter_multiplier = 3

[conversation]
# user / assistant 消息各算一条。
max_history_messages = 12
